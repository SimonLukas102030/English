<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Australia Project</title>
    <script src="https://cdn.jsdelivr.net/npm/markmap-autoloader"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        :root {
            --primary: #2d3436;
            --accent: #0984e3;
            --bg: #ffffff;
        }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: var(--bg); overflow: hidden; transition: filter 0.1s; }
        
        /* MATRIX EFFECT */
        #matrix-canvas {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: black;
            z-index: 10000;
        }

        /* WOW EFFECT */
        .wow-mode { animation: rainbow-puke 0.2s infinite alternate; }
        @keyframes rainbow-puke {
            0% { filter: hue-rotate(0deg) invert(0.5) contrast(200%); background: #ff00ff; }
            100% { filter: hue-rotate(360deg) invert(0) contrast(500%); background: #00ff00; }
        }

        /* LEVEL UP EFFECT */
        .levelup-mode { animation: level-flash 0.3s infinite; }
        @keyframes level-flash {
            0% { background: #ffffff; filter: brightness(1); }
            50% { background: #2ecc71; filter: brightness(1.5) contrast(150%); }
            100% { background: #ffffff; filter: brightness(1); }
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9999;
            justify-content: center; align-items: center;
            pointer-events: none;
        }
        .overlay img { max-width: 80%; max-height: 80%; animation: shake 0.1s infinite; }
        @keyframes shake {
            0% { transform: translate(2px, 2px); }
            50% { transform: translate(-4px, -3px); }
            100% { transform: translate(2px, -2px); }
        }

        /* Layout */
        header {
            display: flex; justify-content: center; gap: 20px; padding: 15px;
            background: #f8f9fa; border-bottom: 1px solid #ddd; z-index: 100;
        }
        .tab-btn { padding: 8px 20px; border: none; background: none; cursor: pointer; font-size: 16px; border-radius: 5px; transition: 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; }
        #admin-tab { display: none; color: #2ecc71; font-weight: bold; border: 1px dashed #2ecc71; }

        .page { display: none; height: calc(100vh - 70px); width: 100%; }
        .page.active { display: block; }
        .markmap { width: 100%; height: 100%; }
        
        /* Admin Page */
        #admin-page { padding: 40px; text-align: center; background: #1e1e1e; color: #00ff00; }
        .hack-btn { padding: 15px 30px; margin: 10px; font-size: 18px; cursor: pointer; background: #333; color: #0f0; border: 1px solid #0f0; }
        .hack-btn:hover { background: #0f0; color: #000; }
    </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<div id="wow-overlay" class="overlay"> <img src="wow.png" alt="WOW"> </div>
<div id="levelup-overlay" class="overlay"> <img src="levelupfast.png" alt="LEVEL UP"> </div>

<header>
    <button class="tab-btn active" onclick="showPage('mindmap')">Mindmap</button>
    <button class="tab-btn" onclick="showPage('info-page')">Infos</button>
    <button class="tab-btn" onclick="showPage('map-page')">Google Maps</button>
    <button id="admin-tab" class="tab-btn" onclick="showPage('admin-page')">ADMIN PANEL</button>
</header>

<div id="mindmap" class="page active">
    <div class="markmap">
        <script type="text/template">
# Australia
## GTA YouTubers
- DarkViperAU
## Scarry animals
- spiders 🕷️
- Boxers 🦘
## Nature
- wird mountains (Uluru)
- Big island vibes
        </script>
    </div>
</div>

<div id="info-page" class="page">
    <div style="padding:40px">
        <h2>System Logs</h2>
        <p>Type "hack" to access root.</p>
    </div>
</div>

<div id="map-page" class="page"> <div id="map" style="height:100%"></div> </div>

<div id="admin-page" class="page">
    <h1>ROOT ACCESS GRANTED</h1>
    <button class="hack-btn" onclick="triggerEffect('wow-mode', 'wow-overlay')">TRIGGER WOW</button>
    <button class="hack-btn" onclick="triggerEffect('levelup-mode', 'levelup-overlay')">TRIGGER LEVELUP</button>
</div>

<script>
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        event.currentTarget.classList.add('active');
        if(pageId === 'map-page') { setTimeout(() => { map.invalidateSize(); }, 100); }
    }

    var map = L.map('map').setView([-25.2, 133.7], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let inputBuffer = "";
    window.addEventListener("keydown", (e) => {
        inputBuffer += e.key.toLowerCase();
        inputBuffer = inputBuffer.slice(-15);
        if (inputBuffer.endsWith("hack")) { startMatrix(); }
        if (inputBuffer.endsWith("wow")) { triggerEffect('wow-mode', 'wow-overlay'); }
        if (inputBuffer.endsWith("levelupfast")) { triggerEffect('levelup-mode', 'levelup-overlay'); }
    });

    function triggerEffect(className, overlayId) {
        document.body.classList.add(className);
        document.getElementById(overlayId).style.display = 'flex';
        setTimeout(() => {
            document.body.classList.remove(className);
            document.getElementById(overlayId).style.display = 'none';
        }, 5000);
    }

    function startMatrix() {
        const canvas = document.getElementById("matrix-canvas");
        const ctx = canvas.getContext("2d");
        canvas.style.display = "block";
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@&*%".split("");
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0F0";
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        const interval = setInterval(draw, 33);
        setTimeout(() => {
            clearInterval(interval);
            canvas.style.display = "none";
            document.getElementById("admin-tab").style.display = "inline-block";
        }, 3000);
    }
</script>
</body>
</html>
