<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Australia Project</title>
    <script src="https://cdn.jsdelivr.net/npm/markmap-autoloader"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        :root {
            --primary: #2d3436;
            --accent: #0984e3;
            --bg: #ffffff;
        }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: var(--bg); overflow: hidden; transition: filter 0.1s; }
        
        /* THE "AWFULL" WOW EFFECT */
        .wow-mode {
            animation: rainbow-puke 0.2s infinite alternate;
            cursor: wait;
        }
        @keyframes rainbow-puke {
            0% { filter: hue-rotate(0deg) invert(0.5) contrast(200%); background: #ff00ff; }
            100% { filter: hue-rotate(360deg) invert(0) contrast(500%); background: #00ff00; }
        }

        #wow-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(255,0,0,0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        #wow-overlay img {
            max-width: 90%;
            max-height: 90%;
            animation: shake 0.1s infinite;
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            50% { transform: translate(-3px, -2px) rotate(-5deg); }
            100% { transform: translate(1px, -1px) rotate(5deg); }
        }

        /* Standard Layout */
        header {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
            z-index: 100;
        }
        .tab-btn {
            padding: 8px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
            transition: 0.2s;
        }
        .tab-btn.active { background: var(--primary); color: white; }
        .page { display: none; height: calc(100vh - 70px); width: 100%; }
        .page.active { display: block; }
        .markmap { width: 100%; height: 100%; }
        #info-page { padding: 40px; overflow-y: auto; max-width: 800px; margin: 0 auto; line-height: 1.6; }
        .info-card { background: #f1f2f6; padding: 20px; border-radius: 10px; margin-bottom: 20px; border-left: 5px solid var(--primary); }
        #map { width: 100%; height: 100%; }
    </style>
</head>
<body>

<div id="wow-overlay">
    <img src="wow.png" alt="WOW">
</div>

<header>
    <button class="tab-btn active" onclick="showPage('mindmap')">Mindmap</button>
    <button class="tab-btn" onclick="showPage('info-page')">Infos</button>
    <button class="tab-btn" onclick="showPage('map-page')">Google Maps</button>
</header>

<div id="mindmap" class="page active">
    <div class="markmap">
        <script type="text/template">
---
markmap:
  colorFreezeLevel: 2
---
# Australia
## GTA YouTubers
- DarkViperAU 
- Chaos mod 
## Scarry animals
- spiders 🕷️
- Boxers 🦘
## Cities
### sydney
- Opera House
## Nature & Vibes
### wird outoff place mountains
- Uluru 🧱
## Food & Life
- Vegemite 🍞
- Hot as hell ☀️🔥
        </script>
    </div>
</div>

<div id="info-page" class="page">
    <div class="info-card">
        <h3>General</h3>
        <p>Australia is basically just a big island with some wird outoff place mountains. Type "wow" to see magic.</p>
    </div>
</div>

<div id="map-page" class="page">
    <div id="map"></div>
</div>

<script>
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        event.currentTarget.classList.add('active');
        if(pageId === 'map-page') { setTimeout(() => { map.invalidateSize(); }, 100); }
    }

    var map = L.map('map').setView([-25.2744, 133.7751], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // WOW TRIGGER LOGIC
    let inputBuffer = "";
    window.addEventListener("keydown", (e) => {
        inputBuffer += e.key.toLowerCase();
        inputBuffer = inputBuffer.slice(-3); // Keep last 3 chars

        if (inputBuffer === "wow") {
            triggerWow();
        }
    });

    function triggerWow() {
        const body = document.body;
        const overlay = document.getElementById('wow-overlay');
        
        body.classList.add('wow-mode');
        overlay.style.display = 'flex';

        setTimeout(() => {
            body.classList.remove('wow-mode');
            overlay.style.display = 'none';
            inputBuffer = ""; 
        }, 5000);
    }
</script>

</body>
</html>
