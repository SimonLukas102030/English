<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Australia - Final Project</title>
    <script src="https://cdn.jsdelivr.net/npm/markmap-autoloader"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        :root { --primary: #2d3436; --accent: #0984e3; --bg: #ffffff; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: var(--bg); overflow: hidden; }
        
        /* MATRIX & OVERLAYS */
        #matrix-canvas { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; z-index: 10000; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; justify-content: center; align-items: center; pointer-events: none; }
        .overlay img { max-width: 60%; animation: shake 0.1s infinite; }

        /* BONZI BUDDY */
        #bonzi { display: none; position: fixed; width: 150px; z-index: 9998; cursor: pointer; transition: all 0.5s linear; }

        /* BUTTERFLY SCREENSAVER */
        #screensaver { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; z-index: 9997; }
        .butterfly { position: absolute; width: 100px; transition: all 1s linear; }

        /* DESTRUCTION CLASSES */
        .wow-mode { animation: rainbow 0.1s infinite; }
        @keyframes rainbow { 0% { filter: hue-rotate(0deg) invert(1); } 100% { filter: hue-rotate(360deg) invert(0); } }
        .nuke-mode { filter: contrast(500%) saturate(1000%); animation: vibrate 0.05s infinite; }
        @keyframes vibrate { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-2px, -2px); } 100% { transform: translate(2px, -2px); } }
        @keyframes shake { 0% { transform: translate(5px, 5px); } 100% { transform: translate(-5px, -5px); } }

        /* UI */
        header { display: flex; justify-content: center; gap: 20px; padding: 15px; background: #fff; border-bottom: 2px solid #eee; z-index: 100; }
        .tab-btn { padding: 10px 25px; border: none; background: #f1f2f6; cursor: pointer; border-radius: 8px; font-weight: bold; }
        .tab-btn.active { background: var(--primary); color: white; }
        #admin-tab { display: none; background: #000; color: #0f0; border: 1px solid #0f0; }

        .page { display: none; height: calc(100vh - 70px); width: 100%; overflow-y: auto; }
        .page.active { display: block; }
        .container { max-width: 900px; margin: 0 auto; padding: 40px; }

        /* ADMIN */
        #admin-page { background: #0a0a0a; color: #0f0; font-family: monospace; }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .danger-btn { padding: 15px; background: #222; color: #0f0; border: 1px solid #0f0; cursor: pointer; }
        .danger-btn:hover { background: #0f0; color: #000; }
    </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>
<img id="bonzi" src="https://upload.wikimedia.org/wikipedia/en/thumb/f/f1/BonziBuddy_v2.png/150px-BonziBuddy_v2.png">
<div id="screensaver"></div>

<div id="wow-overlay" class="overlay"><img src="wow.png"></div>
<div id="levelup-overlay" class="overlay"><img src="levelupfast.png"></div>

<header>
    <button class="tab-btn active" onclick="showPage('mindmap')">Mindmap</button>
    <button class="tab-btn" onclick="showPage('info-page')">Information</button>
    <button class="tab-btn" onclick="showPage('map-page')">Map</button>
    <button id="admin-tab" class="tab-btn" onclick="showPage('admin-page')">DEBUG_CONSOLE</button>
</header>

<div id="mindmap" class="page active">
    <div class="markmap">
        <script type="text/template">
# Australia
## Wildlife
- Spiders 🕷️
- Kangaroos 🦘
## Places
- Outback
- Sydney
        </script>
    </div>
</div>

<div id="info-page" class="page">
    <div class="container">
        <h1>Australia Overview</h1>
        <p>Australia is a country and continent surrounded by the Indian and Pacific oceans.</p>
    </div>
</div>

<div id="map-page" class="page"><div id="map" style="height: 100%;"></div></div>

<div id="admin-page" class="page">
    <div class="container">
        <h1>SYSTEM OVERRIDE</h1>
        <div class="admin-grid">
            <button class="danger-btn" onclick="triggerEffect('wow-mode', 'wow-overlay')">WOW_GLITCH</button>
            <button class="danger-btn" onclick="toggleBonzi()">SPAWN BONZI</button>
            <button class="danger-btn" onclick="toggleScreensaver()">MSN_BUTTERFLY</button>
            <button class="danger-btn" onclick="tabStorm()" style="color:red; border-color:red;">TAB_STORM (Lags!)</button>
            <button class="danger-btn" onclick="document.body.classList.toggle('nuke-mode')">NUKE_UI</button>
            <button class="danger-btn" onclick="location.reload()">REBOOT</button>
        </div>
    </div>
</div>

<script>
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        event.currentTarget.classList.add('active');
        if(pageId === 'map-page') { setTimeout(() => map.invalidateSize(), 200); }
    }

    var map = L.map('map').setView([-25, 133], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let inputBuffer = "";
    window.addEventListener("keydown", (e) => {
        inputBuffer += e.key.toLowerCase();
        inputBuffer = inputBuffer.slice(-4);
        if (inputBuffer === "hack") startMatrix();
    });

    function triggerEffect(className, overlayId) {
        document.body.classList.add(className);
        document.getElementById(overlayId).style.display = 'flex';
        setTimeout(() => {
            document.body.classList.remove(className);
            document.getElementById(overlayId).style.display = 'none';
        }, 5000);
    }

    function toggleBonzi() {
        const b = document.getElementById('bonzi');
        b.style.display = 'block';
        setInterval(() => {
            b.style.left = Math.random() * (window.innerWidth - 150) + "px";
            b.style.top = Math.random() * (window.innerHeight - 150) + "px";
        }, 2000);
    }

    function toggleScreensaver() {
        const s = document.getElementById('screensaver');
        s.style.display = (s.style.display === 'block') ? 'none' : 'block';
        if(s.style.display === 'block') {
            s.innerHTML = '<img src="https://upload.wikimedia.org/wikipedia/commons/5/52/Msn_messenger_logo.png" class="butterfly" id="fly">';
            const fly = document.getElementById('fly');
            setInterval(() => {
                fly.style.left = Math.random() * 90 + "vw";
                fly.style.top = Math.random() * 90 + "vh";
            }, 1000);
        }
    }

    // TAB STORM - Rekursives Öffnen
    function tabStorm() {
        // Hinweis: Browser blockieren Popups oft. Du musst "Popups erlauben" klicken.
        const currentUrl = window.location.href;
        for(let i=0; i<5; i++) {
            window.open(currentUrl, '_blank');
        }
    }

    function startMatrix() {
        const canvas = document.getElementById("matrix-canvas");
        const ctx = canvas.getContext("2d");
        canvas.style.display = "block";
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const drops = Array(Math.floor(canvas.width/16)).fill(1);
        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0F0";
            drops.forEach((y, i) => {
                ctx.fillText(String.fromCharCode(Math.random()*128), i*16, y*16);
                if (y*16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        const interval = setInterval(draw, 33);
        setTimeout(() => { 
            clearInterval(interval); canvas.style.display = "none"; 
            document.getElementById("admin-tab").style.display = "inline-block";
        }, 3000);
    }
</script>
</body>
</html>
