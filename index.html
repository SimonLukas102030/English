<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Australia - Total System Meltdown</title>
    <script src="https://cdn.jsdelivr.net/npm/markmap-autoloader"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        :root { --primary: #2d3436; --accent: #0984e3; --bg: #ffffff; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: var(--bg); overflow-x: hidden; }
        
        #matrix-canvas { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; z-index: 10000; }
        #bonzi { display: none; position: fixed; width: 150px; z-index: 9998; cursor: pointer; transition: all 0.5s ease-in-out; }
        #screensaver { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 9997; }
        .butterfly { position: absolute; width: 60px; transition: all 1.5s ease-in-out; }

        .wow-mode { animation: rainbow 0.1s infinite; }
        .nuke-mode { filter: contrast(500%) saturate(1000%); animation: vibrate 0.05s infinite; }
        .mirror-mode { transform: scaleX(-1); }
        .upside-down { transform: rotate(180deg); }
        .earthquake { animation: vibrate 0.1s infinite; }

        @keyframes rainbow { 0% { filter: hue-rotate(0deg) invert(1); } 100% { filter: hue-rotate(360deg) invert(0); } }
        @keyframes vibrate { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-2px, -2px); } 100% { transform: translate(2px, -2px); } }

        header { display: flex; justify-content: center; gap: 10px; padding: 15px; background: #fff; border-bottom: 2px solid #eee; z-index: 100; flex-wrap: wrap; }
        .tab-btn { padding: 8px 15px; border: none; background: #f1f2f6; cursor: pointer; border-radius: 8px; font-weight: bold; }
        .tab-btn.active { background: var(--primary); color: white; }
        #admin-tab { display: none; background: #000; color: #0f0; border: 1px solid #0f0; }

        .page { display: none; height: calc(100vh - 150px); width: 100%; overflow-y: auto; }
        .page.active { display: block; }
        .container { max-width: 900px; margin: 0 auto; padding: 40px; }

        #admin-page { background: #0a0a0a; color: #0f0; font-family: monospace; }
        .admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 20px; }
        .danger-btn { padding: 12px; background: #222; color: #0f0; border: 1px solid #0f0; cursor: pointer; font-size: 11px; font-weight: bold; }
        .danger-btn:hover { background: #0f0; color: #000; }
    </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>
<img id="bonzi" src="https://static.wikia.nocookie.net/supermario231/images/3/3f/BonziBUDDY.png/revision/latest?cb=20190430062642">
<div id="screensaver"></div>

<header id="main-header">
    <button class="tab-btn active" onclick="showPage('mindmap')">Mindmap</button>
    <button class="tab-btn" onclick="showPage('info-page')">Information</button>
    <button class="tab-btn" onclick="showPage('map-page')">Map</button>
    <button id="admin-tab" class="tab-btn" onclick="showPage('admin-page')">DEBUG_CONSOLE</button>
</header>

<div id="mindmap" class="page active">
    <div class="markmap">
        <script type="text/template">
# Australia
## Wildlife
- Spiders 🕷️
- Kangaroos 🦘
        </script>
    </div>
</div>

<div id="info-page" class="page"><div class="container"><h1>Australia</h1><p>Welcome to the lag zone.</p></div></div>
<div id="map-page" class="page"><div id="map" style="height: 100%;"></div></div>

<div id="admin-page" class="page">
    <div class="container">
        <h1>ROOT@CHAOS_SYSTEM:~#</h1>
        <div class="admin-grid" id="chaos-grid">
            <button class="danger-btn" onclick="triggerEffect('wow-mode')">WOW_GLITCH</button>
            <button class="danger-btn" onclick="toggleBonzi()">SPAWN BONZI</button>
            <button class="danger-btn" onclick="toggleScreensaver()">BUTTERFLY_SWARM</button>
            <button class="danger-btn" onclick="document.body.classList.toggle('nuke-mode')">NUKE_UI</button>
            <button class="danger-btn" onclick="document.body.classList.toggle('mirror-mode')">MIRROR_MODE</button>
            <button class="danger-btn" onclick="document.body.classList.toggle('upside-down')">FLIP_WORLD</button>
            <button class="danger-btn" onclick="document.body.classList.toggle('earthquake')">EARTHQUAKE</button>
            <button class="danger-btn" onclick="scrambleText()">SCRAMBLE_TEXT</button>
            <button class="danger-btn" onclick="comicSans()">COMIC_SANS_VIRUS</button>
            <button class="danger-btn" onclick="fakeError()">TRIGGER_ERROR</button>
            <button class="danger-btn" onclick="floatButtons()">FLOATING_UI</button>
            <button class="danger-btn" onclick="tabStorm()" style="color:red;">TAB_STORM</button>
            <button class="danger-btn" onclick="ramEater()">RAM_EATER</button>
            <button class="danger-btn" onclick="cpuLag()">CPU_BURNER</button>
            <button class="danger-btn" onclick="downloadSpam()">DOWNLOAD_WOW</button>
            <button class="danger-btn" onclick="renderChaos()">RENDER_STRESS</button>
            <button class="danger-btn" onclick="window.print()">PRINT_TRAP</button>
            <button class="danger-btn" onclick="alertStorm()">ALERT_STORM</button>
            <button class="danger-btn" onclick="while(true){}">FREEZE_PAGE</button>
            <button class="danger-btn" onclick="location.reload()">REBOOT</button>
        </div>
    </div>
</div>

<script>
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        const targetPage = document.getElementById(pageId);
        if(targetPage) targetPage.classList.add('active');
        if(pageId === 'map-page') { setTimeout(() => map.invalidateSize(), 200); }
    }

    var map = L.map('map').setView([-25, 133], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    function startMatrix() {
        const canvas = document.getElementById("matrix-canvas");
        const ctx = canvas.getContext("2d");
        canvas.style.display = "block";
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const drops = Array(Math.floor(canvas.width/16)).fill(1);
        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0F0";
            drops.forEach((y, i) => {
                ctx.fillText(String.fromCharCode(Math.random()*128), i*16, y*16);
                if (y*16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        const interval = setInterval(draw, 33);
        setTimeout(() => { 
            clearInterval(interval); canvas.style.display = "none"; 
            document.getElementById("admin-tab").style.display = "inline-block";
        }, 3000);
    }

    window.addEventListener("keydown", (e) => {
        if (e.key === "h") inputBuffer = "h"; else inputBuffer += e.key;
        if (inputBuffer.includes("hack")) startMatrix();
    });

    function triggerEffect(className) {
        document.body.classList.add(className);
        setTimeout(() => document.body.classList.remove(className), 5000);
    }

    function toggleBonzi() {
        const b = document.getElementById('bonzi');
        b.style.display = 'block';
        setInterval(() => {
            b.style.left = Math.random() * (window.innerWidth - 150) + "px";
            b.style.top = Math.random() * (window.innerHeight - 150) + "px";
            const buttons = document.querySelectorAll('#chaos-grid .danger-btn');
            buttons[Math.floor(Math.random() * buttons.length)].click();
        }, 2000);
    }

    function toggleScreensaver() {
        const s = document.getElementById('screensaver');
        s.style.display = (s.style.display === 'block') ? 'none' : 'block';
        if(s.style.display === 'block') {
            for(let i = 0; i < 20; i++) {
                const fly = document.createElement('img');
                fly.src = "https://www.shutterstock.com/image-vector/charming-pixel-art-butterfly-illustration-600w-2657831733.jpg";
                fly.className = 'butterfly';
                s.appendChild(fly);
                setInterval(() => {
                    fly.style.left = Math.random() * 90 + "vw";
                    fly.style.top = Math.random() * 90 + "vh";
                }, 1000);
            }
        }
    }

    function ramEater() {
        let memoryLeak = [];
        setInterval(() => {
            for(let i=0; i<10000; i++) memoryLeak.push(new Array(100).fill("LAG"));
        }, 100);
    }

    function cpuLag() {
        setInterval(() => {
            for(let i=0; i<1000000; i++) { Math.sqrt(Math.random() * Math.random()); }
        }, 50);
    }

    function downloadSpam() {
        const link = document.createElement('a');
        link.href = 'wow.png';
        link.download = 'wow.png';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function renderChaos() {
        setInterval(() => {
            document.querySelectorAll('*').forEach(el => {
                el.style.zIndex = Math.floor(Math.random() * 10000);
            });
        }, 100);
    }

    function alertStorm() {
        for(let i=0; i<10; i++) alert("SYSTEM OVERLOAD " + i);
    }

    function tabStorm() {
        for(let i=0; i<5; i++) window.open('about:blank', '_blank', 'width=200,height=200');
    }

    function scrambleText() {
        document.querySelectorAll('h1, p').forEach(el => {
            el.innerText = el.innerText.split('').sort(() => 0.5 - Math.random()).join('');
        });
    }

    function comicSans() {
        document.body.style.fontFamily = '"Comic Sans MS", cursive';
    }

    function fakeError() {
        alert("CRITICAL SYSTEM FAILURE");
    }

    function floatButtons() {
        setInterval(() => {
            document.querySelectorAll('button').forEach(btn => {
                btn.style.transform = `translate(${Math.random()*10}px, ${Math.random()*10}px)`;
            });
        }, 50);
    }
</script>
</body>
</html>
